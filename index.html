<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmed & Sama - The Proposal & Invitation</title>
    
    <!-- Elegant Web Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- GSAP for Cinematic Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg-dark: #070913;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --card-bg: #fdfbf7;
            --text-dark: #1f2421;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: 'Playfair Display', serif;
            overflow: hidden; /* Prevents unwanted scrolling during animations */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            perspective: 1000px;
        }

        /* --- Ambient Star Background --- */
        #stars-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle infinite ease-in-out;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.2); box-shadow: 0 0 8px white; }
            100% { opacity: 0.1; transform: scale(0.8); }
        }

        /* --- Start Button --- */
        #start-screen {
            position: absolute;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
            width: 90%;
            text-align: center;
        }
        .pulse-btn {
            padding: 15px 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-light);
            background: transparent;
            border: 1px solid var(--gold-primary);
            border-radius: 30px;
            cursor: pointer;
            animation: pulseBtn 2s infinite;
            max-width: 100%;
        }
        @keyframes pulseBtn {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* --- Scene 1: The Story / Proposal --- */
        #story-scene {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .story-text {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: var(--gold-light);
            position: absolute;
            opacity: 0;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            width: 90%;
        }

        /* --- REALISTIC IMAGE ORBS --- */
        .items-container {
            display: flex;
            gap: 60px;
            position: absolute;
            opacity: 0;
            transform: scale(0.5);
            z-index: 5;
        }

        .photo-orb {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid var(--gold-primary);
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.5), inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .orb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            z-index: 2;
        }

        .photo-orb::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
            z-index: 3;
        }

        .fallback-icon {
            display: none;
            font-size: 80px;
            z-index: 2;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .she-said-yes {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 4rem;
            letter-spacing: 5px;
            color: #fff;
            position: absolute;
            opacity: 0;
            text-shadow: 0 0 20px #fff, 0 0 40px var(--gold-primary);
            width: 90%;
        }

        /* --- Scene 2: The Final Invitation --- */
        #invitation-scene {
            position: absolute;
            z-index: 20;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #070913 0%, #161a2b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; 
            pointer-events: none; 
        }

        .card {
            width: 90%; /* Responsive width */
            max-width: 360px; /* Cap width for large screens */
            height: auto;
            min-height: 480px;
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 40px 25px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 30px rgba(212,175,55,0.2);
            position: relative;
            transform: translateY(50px) scale(0.9);
            border: 1px solid var(--gold-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px dashed var(--gold-primary);
            opacity: 0.6;
            pointer-events: none;
        }

        .card h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            color: #aa841b;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .card h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            color: var(--text-dark);
            margin: 10px 0;
            line-height: 0.9;
        }

        .card .ampersand {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 2.2rem;
            color: #aa841b;
            margin: 0;
        }

        .card p {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.6;
            margin: 15px 0;
            padding: 0 5px;
        }

        .details-box {
            margin-top: 20px;
            border-top: 1px solid rgba(170, 132, 27, 0.3);
            padding-top: 15px;
        }

        .details-box p {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            color: var(--text-dark);
            margin: 8px 0;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .light-burst {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 70%);
            z-index: 15;
            opacity: 0;
            pointer-events: none;
        }

        /* =========================================
           📱 MOBILE RESPONSIVENESS (Media Queries) 
           ========================================= */
        @media screen and (max-width: 600px) {
            .story-text {
                font-size: 2.2rem; /* Smaller text for mobile */
            }

            .she-said-yes {
                font-size: 2.2rem;
                letter-spacing: 3px;
            }

            .items-container {
                gap: 25px; /* Bring images closer */
            }

            .photo-orb {
                width: 110px; /* Smaller circles */
                height: 110px;
            }

            .fallback-icon {
                font-size: 55px; /* Adjust emoji fallback */
            }

            .card {
                padding: 30px 15px; /* Reduce internal spacing */
                min-height: 440px;
            }

            .card h1 {
                font-size: 3rem; /* Scale down names */
            }

            .card .ampersand {
                font-size: 1.8rem;
            }

            .card p {
                font-size: 0.85rem; /* Slightly smaller description */
            }
            
            .details-box p {
                font-size: 0.75rem; /* Keep details clean */
            }
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    <div class="light-burst" id="light-burst"></div>

    <div id="start-screen" onclick="startCinematic()">
        <button class="pulse-btn">Experience The Journey</button>
    </div>

    <!-- Scene 1 -->
    <div id="story-scene">
        <div class="story-text" id="text1">Ahmed had a question...</div>
        <div class="story-text" id="text2">...for his beautiful Sama.</div>
        
        <!-- Beautiful, Realistic Photo Orbs using direct IMGs -->
        <div class="items-container" id="gifts">
            <div class="photo-orb">
                <img class="orb-img" src="https://images.pexels.com/photos/736230/pexels-photo-736230.jpeg?auto=compress&cs=tinysrgb&w=400" alt="Rose" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="fallback-icon">🌹</div>
            </div>
            <div class="photo-orb">
                <img class="orb-img" src="https://images.pexels.com/photos/265856/pexels-photo-265856.jpeg?auto=compress&cs=tinysrgb&w=400" alt="Ring" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div class="fallback-icon">💍</div>
            </div>
        </div>

        <div class="she-said-yes" id="text-yes">AND SHE SAID YES!</div>
    </div>

    <!-- Scene 2 -->
    <div id="invitation-scene">
        <div class="card" id="invitation-card">
            <h3>Wedding Invitation</h3>
            <h1>Ahmed</h1>
            <div class="ampersand">&</div>
            <h1>Sama</h1>
            <p>Joyfully request the honor of your presence as they begin their forever together.</p>
            
            <div class="details-box">
                <p style="color: #aa841b;">MONDAY, 6 / 7 / 2026</p>
                <p>AT 9:00 PM</p>
                <p style="font-weight: 400; margin-top: 15px;">Garden City — Kafr El-Gazar<br>Benha</p>
            </div>
        </div>
    </div>

    <script>
        // Star Background Generation
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 70; i++) {
            let star = document.createElement('div');
            star.classList.add('star');
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }

        function startCinematic() {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('start-screen').style.display = 'none', 500);

            const tl = gsap.timeline();

            // Text sequence
            tl.to("#text1", { opacity: 1, y: -20, duration: 2, ease: "power2.out" })
              .to("#text1", { opacity: 0, y: -40, duration: 1.5, delay: 1 })
              .to("#text2", { opacity: 1, y: -20, duration: 2, ease: "power2.out" })
              .to("#text2", { opacity: 0, y: -40, duration: 1.5, delay: 1 });

            // Display the Realistic Orbs
            tl.to("#gifts", { opacity: 1, scale: 1.1, duration: 2, ease: "back.out(1.5)" })
              .to("#gifts", { y: -15, duration: 2, yoyo: true, repeat: 1, ease: "sine.inOut" }) // Gentle floating
              .to("#gifts", { opacity: 0, scale: 1.5, filter: "blur(15px)", duration: 1.5 });

            // "She Said Yes!" & Light Flash
            tl.to("#text-yes", { opacity: 1, scale: 1.1, duration: 1.5, ease: "elastic.out(1, 0.5)" })
              .to("#text-yes", { scale: 1.2, duration: 2, ease: "none" }) 
              .to("#light-burst", { opacity: 1, duration: 1, ease: "power4.in" }, "-=1");

            // Final Invitation Reveal
            tl.set("#story-scene", { display: "none" }) 
              .set("#invitation-scene", { opacity: 1, pointerEvents: "auto" }) 
              .to("#light-burst", { opacity: 0, duration: 1.5, ease: "power2.out" })
              .to("#invitation-card", { opacity: 1, y: 0, scale: 1, duration: 2, ease: "power3.out" }, "-=1.2");
        }
    </script>
</body>
</html>
